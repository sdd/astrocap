[package]
name = "astrocap_source_gstreamer"
version = "0.1.0"
edition = "2021"

[dependencies]
vyd = { workspace = true }
vyd_gstreamer = { path = "../../vidd/crates/vyd_gstreamer" }

[dev-dependencies]
astrocap_core = { path = "../astrocap_core" }
gst = { package = "gstreamer", version = "0.21", features = ["v1_20"] }
gst-app = { package = "gstreamer-app", version = "0.21", features = ["v1_24"] }
test-log = { version = "0.2", features = ["trace"] }
tracing = { workspace = true }
toml = { workspace = true }
