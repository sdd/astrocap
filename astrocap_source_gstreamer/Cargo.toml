[package]
name = "astrocap_source_gstreamer"
version = "0.1.0"
edition = "2021"

[dependencies]
astrocap_core = { path = "../astrocap_core" }
bytes = "1"
gst = { package = "gstreamer", version = "0.21" }
gst-app = { package = "gstreamer-app", version = "0.21.2" }
gst-base = { package = "gstreamer-base", version = "0.21.2" }
gst-video = { package = "gstreamer-video", version = "0.21.2" }
http = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
once_cell = "1"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
test-log = { version = "0.2", features = ["trace"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
astrocap_source_gstreamer = { path = "." }

[package.metadata.system-deps.gstreamer_1_0]
name = "gstreamer-1.0"
version = "1.0"

[lib]
name = "astrocap_source_gstreamer"
