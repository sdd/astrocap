[source]
stage_type = "astrocap_source_gstreamer::GstSource"
file_path = "tests/processed_crop_1_lossless.mkv"

[[stages]]
stage_type = "astrocap_processor_point_detector::PointDetectorProcessor"
algorithm = "Peak"
point_exclusion_radius_2 = 100
step_x = 1
step_y = 1
point_threshold = 100

[sink]
stage_type = "astrocap_sink_point_detector_evaluator::PointDetectorEvaluatorSink"
annotations_file = "tests/processed_crop_1_lossless-annotations.json"
distance_threshold = 3.0
output_path = "evaluation_results_peak.json"
