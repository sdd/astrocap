[package]
name = "astrocap_processor_tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
astrocap_core = { path = "../astrocap_core" }

az = "1"
image = { workspace = true }
ordered-float = "5"
nalgebra = { workspace = true }
ndarray = "0.15"
rerun = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml = { workspace = true }
tracing = { workspace = true }
kiddo = { version = "5" }
nonmax = "0.5.5"
statrs = "0.18.0"


[dev-dependencies]
kiddo = { version = "5" }

[lib]
name = "astrocap_processor_tracker"
