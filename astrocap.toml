# Finite, checked-in CPU example for the supported GST runtime.
# The former full-sky configuration required an unavailable twilight recording,
# mask image, Rerun server and ModelState stage excluded from this workspace.
[source]
stage_type = "astrocap_source_gstreamer::GstSource"
file_path = "tests/test.mkv"

[[stages]]
stage_type = "astrocap_processor_point_detector::PointDetectorProcessor"
dump = true
algorithm = "LocalMaxima"
centroid_window = 3
min_separation = 10
point_threshold = 80

[[stages]]
stage_type = "astrocap_processor_detection_export::DetectionExportProcessor"
output_path = "detections.json"

[sink]
stage_type = "vyd::DummySink"
