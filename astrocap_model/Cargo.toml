[package]
name = "astrocap_model"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
argmin = "0.8"
argmin-math = { version = "0.3", features = ["ndarray_latest-serde", "nalgebra_latest-serde"] }
az = "1.2.1"
derive_more = "0.99.17"
itertools = "0.12.0"
kiddo = { version = "4.0.0" }
ndarray = "0.15.6"
num-traits = "0.2.16"
ordered-float = "4.2.0"
rusttype = "0.9.3"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
tracing = "0.1.40"
lazy_static = "1.4.0"
nonmax = {  version = "0.5.5", features = ["serde"] }

[dev-dependencies]
imageproc = "0.23.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

[lib]
name = "astrocap_model"
