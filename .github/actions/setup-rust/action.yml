name: Set up Astrocap Rust CI
description: Install Rust and the Linux libraries, codecs, and software GPU used by Astrocap tests.

inputs:
  components:
    description: Additional Rust toolchain components to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: nightly
        components: ${{ inputs.components }}
    - name: Install native build and runtime dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev libwayland-dev \
          libudev-dev libasound2-dev libegl1-mesa-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad gstreamer1.0-libav \
          ffmpeg libvulkan1 mesa-vulkan-drivers
    - name: Configure headless runtime directory
      shell: bash
      run: |
        install -d -m 700 "$RUNNER_TEMP/xdg-runtime"
        echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
    - name: Check video tools
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version
